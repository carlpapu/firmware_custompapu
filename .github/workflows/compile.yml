name: Compilar Firmware XIAO S3

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar Codigo
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Instalar PlatformIO
        run: pip install -U platformio

      - name: Compilar Binario Minimalista
        run: pio run -e seeed_xiao_esp32s3_minimal

      - name: Guardar Archivo BIN
        uses: actions/upload-artifact@v4
        with:
          name: firmware-xiao-s3
          path: .pio/build/seeed_xiao_esp32s3_minimal/firmware.bin
